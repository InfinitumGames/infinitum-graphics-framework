site_name: Infinitum Graphics Framework — Arquivo
site_description: Arquivo técnico do projeto experimental de modernização do OMSI 2
repo_name: InfinitumGames/infinitum-graphics-framework
repo_url: https://github.com/InfinitumGames/infinitum-graphics-framework

theme:
  name: material
  language: pt-BR
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Início: index.md
  - Encerramento e retrospectiva: project-retrospective.md
  - Estado final: current-status.md
  - Roadmap histórico: roadmap.md
  - Arquitetura pesquisada:
      - Visão geral: architecture/overview.md
      - Estratégia híbrida x86/x64: architecture/hybrid-x86-x64.md
      - Runtime Bridge: architecture/runtime-bridge.md
      - Pipeline gráfico: architecture/graphics-pipeline.md
      - Neural Rendering: architecture/neural-rendering.md
      - Performance Engine:
          - Architecture v0.1: architecture/performance-engine.md
          - Telemetry Engine: architecture/telemetry-engine.md
          - Performance Controller: architecture/performance-controller.md
          - Adaptive Quality Manager: architecture/adaptive-quality-manager.md
          - Simulation Budget: architecture/simulation-budget.md
          - External Memory & Cache: architecture/memory-manager.md
      - Loading & Streaming: architecture/loading-streaming.md
  - Pesquisa:
      - Tool Survey: research/tool-survey.md
      - Viabilidade do Performance Engine no OMSI 2: research/omsi-performance-viability.md
      - OmsiHook e controle runtime: research/omsi-hook-runtime.md
      - Controles de performance em runtime: research/runtime-performance-controls.md
      - Adaptive Mirrors e reflexos: research/adaptive-mirrors-reflections.md
  - Desenvolvimento (histórico):
      - Escopo v1.0 não concluído: development/scope-v1.md
      - Cronograma v1.0 cancelado: development/timeline-v1.md
      - Devlog: development/devlog.md
      - Benchmarks: development/benchmarks.md
      - Testes: development/testing.md
      - Problemas conhecidos ao encerramento: development/known-issues.md
  - Compatibilidade:
      - Hardware: compatibility/hardware.md
      - Software: compatibility/software.md
      - Dependências: compatibility/dependencies.md
  - Legal:
      - Terceiros: legal/third-party.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
